name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lang]"

      - name: Run quality gate (ruff lint + format + mypy + fast pytest)
        run: bash scripts/check.sh -- -m "not slow and not benchmark and not test_repo"

      - name: Ranked-path performance budget
        run: pytest tests/benchmarks/test_match_boost_overhead.py -q

      - name: Cold-start latency budget
        run: pytest tests/benchmarks/test_cold_start_latency.py -q
